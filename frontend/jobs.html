<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Available Jobs</title>

<link rel="stylesheet" href="style.css">

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f6fb;
    margin:0;
    padding:40px;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

#jobSearch,
#countryFilter{
    width:100%;
    max-width:700px;
    display:block;
    margin:15px auto;
    padding:12px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

.job-card{
    background:#fff;
    padding:20px;
    margin:20px auto;
    max-width:700px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.job-card h3{
    margin-top:0;
}

.job-card p{
    color:#555;
}

button{
    padding:10px 20px;
    background:#4f46e5;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#372fcf;
}
</style>

</head>

<body>

<h1>Available Europe Jobs</h1>

<input
type="text"
id="jobSearch"
placeholder="🔍 Search jobs..."
>

<select id="countryFilter">
<option value="">🌍 All Countries</option>
<option value="Germany">Germany</option>
<option value="Netherlands">Netherlands</option>
<option value="Poland">Poland</option>
<option value="Sweden">Sweden</option>
<option value="Finland">Finland</option>
<option value="Romania">Romania</option>
</select>

<div id="jobs-container"></div>

<script src="script.js"></script>

</body>
</html>
