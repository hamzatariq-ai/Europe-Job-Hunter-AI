<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Details</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .job-container{
            max-width:900px;
            margin:40px auto;
            background:#fff;
            padding:30px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,.1);
        }

        .job-title{
            font-size:32px;
            margin-bottom:10px;
        }

        .company{
            color:#666;
            margin-bottom:20px;
        }

        .info{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:15px;
            margin:25px 0;
        }

        .box{
            background:#f4f4f4;
            padding:15px;
            border-radius:10px;
        }

        h2{
            margin-top:30px;
            margin-bottom:10px;
        }

        ul{
            padding-left:20px;
        }

        .apply-btn{
            display:inline-block;
            margin-top:30px;
            background:#4f46e5;
            color:white;
            padding:15px 30px;
            text-decoration:none;
            border-radius:10px;
            font-weight:bold;
        }

        .back-btn{
            display:inline-block;
            margin-top:20px;
            margin-right:15px;
            text-decoration:none;
            color:#4f46e5;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="job-container">

<h1 class="job-title" id="title"></h1>

<p class="company" id="company"></p>

<div class="info">

<div class="box">
<b>Location</b><br>
<span id="location"></span>
</div>

<div class="box">
<b>Remote</b><br>
<span id="remote"></span>
</div>

</div>

<h2>Job Description</h2>

<div id="description"></div>

<a class="back-btn" href="jobs.html">
⬅ Back
</a>

<a class="apply-btn" id="applyLink" target="_blank">
Apply Now
</a>

</div>

<script>

const slug = new URLSearchParams(window.location.search).get("slug");

fetch("http://127.0.0.1:8000/live-jobs")
.then(res => res.json())
.then(data => {

const job = data.data.find(j => j.slug === slug);

if(!job){
    alert("Job not found");
    return;
}

document.getElementById("title").innerText = job.title;
document.getElementById("company").innerText = job.company_name;
document.getElementById("location").innerText = job.location;
document.getElementById("remote").innerText = job.remote ? "Yes" : "No";
document.getElementById("description").innerHTML = job.description;
document.getElementById("applyLink").href = job.url;

});

</script>

</body>
</html>
