<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Job Matcher</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

<main style="padding:40px; max-width:1200px; margin:auto;">

    <h1>🔍 AI Job Matcher</h1>
    <p>Find Visa Sponsored Jobs Across Europe</p>

    <br>

    <input
        type="text"
        placeholder="Search Jobs..."
        style="width:100%;padding:15px;font-size:18px;border-radius:10px;border:1px solid #ccc;">

    <br><br>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;">

        <div style="padding:20px;border-radius:15px;background:white;box-shadow:0 5px 15px rgba(0,0,0,.1);">

            <h2>🇩🇪 Germany</h2>

            <h3>Warehouse Worker</h3>

            <p>Salary: €2500 / Month</p>

            <p>Visa Sponsorship ✅</p>

            <a href="job-details.html">
    <button>Apply Now</button>
</a>

        </div>

        <div style="padding:20px;border-radius:15px;background:white;box-shadow:0 5px 15px rgba(0,0,0,.1);">

            <h2>🇵🇱 Poland</h2>

            <h3>Factory Worker</h3>

            <p>Salary: €1800 / Month</p>

            <p>Accommodation ✅</p>

            <a href="job-details.html">
    <button>Apply Now</button>
</a>

        </div>

    </div>

</main>

<script src="script.js"></script>

</body>
</html>
