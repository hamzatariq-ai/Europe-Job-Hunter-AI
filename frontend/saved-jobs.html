<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saved Jobs</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f6fb;
    margin:0;
    padding:40px;
}

h1{
    text-align:center;
}

.job-card{
    background:#fff;
    max-width:700px;
    margin:20px auto;
    padding:20px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

button{
    padding:10px 20px;
    border:none;
    border-radius:8px;
    background:#4f46e5;
    color:#fff;
    cursor:pointer;
}

button:hover{
    background:#372fcf;
}
</style>

</head>

<body>

<h1>❤️ Saved Jobs</h1>

<div id="savedJobs"></div>

<script>

const saved = JSON.parse(localStorage.getItem("savedJobs")) || [];

fetch("http://127.0.0.1:8000/live-jobs")
.then(res=>res.json())
.then(result=>{

const jobs = result.data;

const container = document.getElementById("savedJobs");

saved.forEach(slug=>{

const job = jobs.find(j=>j.slug===slug);

if(job){

container.innerHTML += `
<div class="job-card">

<h2>${job.title}</h2>

<p><b>${job.company_name}</b></p>

<p>${job.location}</p>

<a href="job-details.html?slug=${job.slug}">
<button>View Details</button>
</a>

</div>
`;

}

});

});

</script>

</body>
</html>
