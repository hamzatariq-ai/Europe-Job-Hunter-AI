<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<link rel="stylesheet" href="style.css">

<style>
body{
    background:#f4f6fb;
    font-family:Arial,sans-serif;
}

.container{
    width:400px;
    margin:80px auto;
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    background:#4f46e5;
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#372fcf;
}

p{
    text-align:center;
    margin-top:20px;
}

a{
    color:#4f46e5;
    text-decoration:none;
}
</style>

</head>

<body>

<div class="container">

<h1>Login</h1>

<form id="loginForm">

<div class="input-group">
<label>Email</label>
<input type="email" id="email" required>
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="password" required>
</div>

<button type="submit">
Login
</button>

</form>

<p>
Don't have an account?
<a href="signup.html">Sign Up</a>
</p>

</div>
<script>
document.getElementById("loginForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const response = await fetch("http://127.0.0.1:8000/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            email: email,
            password: password
        })
    });

    const data = await response.json();

    if(data.message === "Login Successful"){

        alert("Welcome " + data.name);

        window.location.href = "index.html";

    }else{

        alert(data.message);

    }

});
</script>
</body>
</html>
