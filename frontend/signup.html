<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>

<link rel="stylesheet" href="style.css">

<style>
body{
    background:#f4f6fb;
    font-family:Arial,sans-serif;
}

.container{
    width:400px;
    margin:60px auto;
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    background:#4f46e5;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#372fcf;
}

p{
    text-align:center;
    margin-top:20px;
}

a{
    color:#4f46e5;
    text-decoration:none;
}
</style>

</head>

<body>

<div class="container">

<h1>Create Account</h1>

<form action="login.html">

<div class="input-group">
<label>Full Name</label>
<input type="text" required>
</div>

<div class="input-group">
<label>Email</label>
<input type="email" required>
</div>

<div class="input-group">
<label>Password</label>
<input type="password" required>
</div>

<div class="input-group">
<label>Confirm Password</label>
<input type="password" required>
</div>

<button type="submit">
Create Account
</button>

</form>

<p>
Already have an account?
<a href="login.html">Login</a>
</p>

</div>

</body>
</html>
